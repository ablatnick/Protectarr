# Optional. Protectarr can be set up with environment variables alone (see docker-compose.yml).
# To use a file instead, copy this to ./protectarr/config/config.yml. When the file exists, environment
# variables are ignored except where you reference them as ${VAR}.

qbittorrent:
  url: http://qbittorrent:8080
  username: admin
  password: ${QBIT_PASSWORD}
  # Leave empty to check the categories your *arr apps use (read from their download client settings).
  categories: []
  # If qBittorrent's "Torrent stop condition" is "Metadata received", Protectarr starts each torrent
  # once its file list passes. Nothing downloads before it's checked.
  resume_after_metadata_check: true

# kind: sonarr | radarr | lidarr | readarr | whisparr. Add as many as you run (e.g. a second Radarr for 4K).
arr:
  - name: Sonarr
    kind: sonarr
    url: http://sonarr:8989
    api_key: ${SONARR_API_KEY}
  - name: Radarr
    kind: radarr
    url: http://radarr:7878
    api_key: ${RADARR_API_KEY}
  # - name: Lidarr
  #   kind: lidarr
  #   url: http://lidarr:8686
  #   api_key: ${LIDARR_API_KEY}

# Optional: shows which indexers send bad releases, with a link to Prowlarr.
prowlarr:
  url: ""
  api_key: ""

clamav:
  enabled: true
  host: clamav
  port: 3310
  stream_max_mb: 25   # up to clamd's StreamMaxLength (25 MB by default)
  scan_media: false   # also scan verified real video/audio (slow for albums and season packs)

rules:
  min_video_mb: 30               # an episode smaller than this is treated as fake
  min_movie_mb: 300              # a movie (Radarr category) smaller than this is treated as fake
  category_min_video_mb: {}      # per-category override, e.g. {tv-anime: 15}
  # What a category holds when no *arr app says so: tv | movie | music | book
  category_profiles: {}
  allow_archives: false          # set true if you run Unpackerr for scene RAR releases
  extra_blocked_extensions: []

# What to do per verdict:
#   block: quarantine files, remove the download, blocklist it in the *arr app
#   hold:  stop it, lock away any files, and wait for Allow/Deny on the Review page
actions:
  malicious: block
  suspicious: hold

# Map paths as qBittorrent sees them to paths inside the Protectarr container.
# Not needed if both containers mount the downloads folder at the same path.
path_mappings: []
#  - remote: /downloads
#    local: /data/downloads

quarantine_dir: /quarantine
data_dir: /config
poll_seconds: 5

# How you open the web UI, if that's through a reverse proxy (so its form posts are accepted).
public_url: http://your-server:9797

# The web UI password (HTTP Basic, any username); hooks pass it as ?key=. Empty means password123 until you set
# your own login on the Settings page.
api_key: ${PROTECTARR_API_KEY}
