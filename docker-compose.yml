# Protectarr on its own. Run qBittorrent, your *arr apps and ClamAV however you already do, then open
# http://your-server:9797/settings and enter the address (URL and port) and API key of each one.

services:
  protectarr:
    image: ghcr.io/ablatnick/protectarr:latest    # or "build: ." to build from a clone of this repo
    container_name: protectarr
    user: "1000:1000"                          # CHANGE: the same PUID:PGID as qBittorrent
    environment:
      PROTECTARR_API_KEY: changeme             # CHANGE: the web UI password (any username); without it, password123
      # PUBLIC_URL: https://protectarr.example.com   # optional: only behind a reverse proxy
    volumes:
      - ./protectarr/config:/config            # settings and history
      - ./protectarr/quarantine:/quarantine    # blocked files
      - /path/to/downloads:/downloads          # CHANGE: the same folder, at the same path, as in qBittorrent
    ports:
      - "9797:9797"
    restart: unless-stopped
